<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小程序数据获取、接口与缓存深度诊断</title>
  <style>
    :root {
      --ink: #18201d;
      --muted: #68736e;
      --paper: #f7f3e9;
      --panel: rgba(255,255,255,.82);
      --line: #d9d5c9;
      --accent: #bd4b2f;
      --accent-soft: #f4dfd7;
      --green: #1f6f5c;
      --green-soft: #dcece6;
      --code: #202825;
      --shadow: 0 18px 55px rgba(52,48,38,.1);
      --serif: "Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
      --sans: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font: 15.5px/1.78 var(--sans);
      background:
        radial-gradient(circle at 8% 4%, rgba(189,75,47,.12), transparent 25rem),
        radial-gradient(circle at 92% 12%, rgba(31,111,92,.11), transparent 28rem),
        linear-gradient(115deg, transparent 0 49%, rgba(24,32,29,.025) 49% 51%, transparent 51% 100%),
        var(--paper);
      background-size: auto, auto, 38px 38px, auto;
    }
    #progress {
      position: fixed; z-index: 20; inset: 0 auto auto 0; height: 3px; width: 0;
      background: linear-gradient(90deg, var(--accent), #db8b50, var(--green));
    }
    .masthead {
      padding: 58px 7vw 44px;
      border-bottom: 1px solid rgba(24,32,29,.12);
    }
    .eyebrow {
      margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
    }
    .masthead h1 {
      max-width: 920px; margin: 0; font: 700 clamp(34px,5vw,66px)/1.08 var(--serif);
      letter-spacing: -.035em;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 24px;
      color: var(--muted); font-size: 13px;
    }
    .meta span:first-child {
      color: var(--green); background: var(--green-soft); padding: 3px 10px;
      border-radius: 999px; font-weight: 700;
    }
    .layout {
      display: grid; grid-template-columns: minmax(190px,260px) minmax(0,860px);
      gap: clamp(34px,6vw,88px); max-width: 1240px; margin: 0 auto; padding: 48px 30px 90px;
    }
    aside { position: relative; }
    .toc-shell {
      position: sticky; top: 30px; max-height: calc(100vh - 60px); overflow: auto;
      padding: 18px 16px 20px; border-left: 2px solid var(--line);
    }
    .toc-title {
      margin: 0 0 12px; font-size: 11px; font-weight: 800; color: var(--muted);
      letter-spacing: .16em; text-transform: uppercase;
    }
    #toc { display: grid; gap: 2px; }
    #toc a {
      display: block; padding: 4px 8px; color: var(--muted); text-decoration: none;
      font-size: 12px; line-height: 1.45; border-radius: 6px;
    }
    #toc a[data-level="3"] { padding-left: 20px; font-size: 11px; }
    #toc a:hover { color: var(--accent); background: var(--accent-soft); }
    main {
      min-width: 0; padding: 44px clamp(24px,5vw,68px); background: var(--panel);
      border: 1px solid rgba(24,32,29,.09); border-radius: 4px; box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    main > :first-child { margin-top: 0; }
    main h1 { display: none; }
    h2, h3, h4 { scroll-margin-top: 24px; color: #12201b; }
    h2 {
      margin: 3.2em 0 .9em; padding-top: .65em; border-top: 1px solid var(--line);
      font: 700 clamp(25px,3vw,34px)/1.25 var(--serif); letter-spacing: -.02em;
    }
    h2::before { content: ""; display: block; width: 38px; height: 4px; margin-bottom: 14px; background: var(--accent); }
    h3 { margin: 2.2em 0 .7em; font: 700 21px/1.35 var(--serif); }
    h4 { margin: 1.8em 0 .5em; font-size: 16px; }
    p { margin: .75em 0 1.15em; }
    strong { color: #101713; }
    a { color: var(--green); text-underline-offset: 3px; }
    ul, ol { padding-left: 1.4em; }
    li { margin: .28em 0; }
    li::marker { color: var(--accent); font-weight: 700; }
    blockquote {
      margin: 1.6em 0; padding: 14px 20px; color: #394540;
      background: var(--green-soft); border-left: 4px solid var(--green); border-radius: 0 8px 8px 0;
    }
    blockquote > :first-child { margin-top: 0; }
    blockquote > :last-child { margin-bottom: 0; }
    code {
      padding: .15em .38em; color: #8c321e; background: #f2e9df; border-radius: 4px;
      font: .9em/1.5 "SFMono-Regular",Consolas,monospace;
    }
    pre {
      margin: 1.45em 0; padding: 18px 20px; overflow: auto; color: #e7eee9;
      background: var(--code); border-radius: 8px; box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    pre code { padding: 0; color: inherit; background: none; }
    .table-wrap { margin: 1.5em 0 2em; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,.58); font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    th {
      position: sticky; top: 0; color: #fff; background: #26342f;
      font-size: 11px; letter-spacing: .035em; white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) { background: rgba(31,111,92,.045); }
    hr { margin: 2.5em 0; border: 0; border-top: 1px solid var(--line); }
    .mermaid {
      margin: 1.8em 0; padding: 20px; overflow: auto; text-align: center;
      background: rgba(255,255,255,.72); border: 1px solid var(--line); border-radius: 8px;
    }
    .raw-note {
      padding: 12px 15px; color: #733522; background: var(--accent-soft);
      border: 1px solid #ddb6aa; border-radius: 6px;
    }
    @media (max-width: 820px) {
      .masthead { padding: 38px 22px 30px; }
      .layout { display: block; padding: 20px 14px 50px; }
      aside { margin-bottom: 16px; }
      .toc-shell {
        position: static; max-height: 230px; padding: 13px 12px;
        background: rgba(255,255,255,.68); border: 1px solid var(--line); border-radius: 8px;
      }
      main { padding: 30px 20px; border-radius: 8px; }
      h2 { margin-top: 2.5em; }
    }
    @media print {
      body { background: #fff; font-size: 11pt; }
      #progress, aside { display: none; }
      .masthead { padding: 0 0 24px; }
      .layout { display: block; max-width: none; padding: 0; }
      main { padding: 0; border: 0; box-shadow: none; }
      h2 { break-after: avoid; }
      pre, table, blockquote { break-inside: avoid; }
    }
  </style>
</head>

  const escapeHtml = value => value.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

  if (!window.marked) {
    content.innerHTML = '<p class="raw-note">Markdown 渲染库未加载，当前显示原文。联网后刷新可恢复排版。</p><pre><code>' + escapeHtml(source) + '</code></pre>';
    return;
  }

  marked.setOptions({ gfm: true, breaks: false });
  content.innerHTML = marked.parse(source);

  content.querySelectorAll('table').forEach(table => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });

  const seen = new Map();
  const slug = text => {
    const base = text.trim().toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, '-')
      .replace(/^-+|-+$/g, '') || 'section';
    const count = seen.get(base) || 0;
    seen.set(base, count + 1);
    return count ? base + '-' + (count + 1) : base;
  };

  const toc = document.getElementById('toc');
  content.querySelectorAll('h2, h3').forEach(heading => {
    heading.id = slug(heading.textContent);
    const link = document.createElement('a');
    link.href = '#' + heading.id;
    link.dataset.level = heading.tagName.slice(1);
    link.textContent = heading.textContent;
    toc.appendChild(link);
  });

  if (window.mermaid) {
    content.querySelectorAll('pre code.language-mermaid').forEach(code => {
      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = code.textContent;
      code.parentElement.replaceWith(diagram);
    });
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#dcece6',
        primaryTextColor: '#18201d',
        primaryBorderColor: '#1f6f5c',
        lineColor: '#68736e',
        secondaryColor: '#f4dfd7',
        tertiaryColor: '#f7f3e9',
        fontFamily: 'PingFang SC, sans-serif'
      }
    });
    mermaid.run({ querySelector: '.mermaid' });
  }

  const progress = document.getElementById('progress');
  const updateProgress = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    progress.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
  };
  addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();
})();
</script>
</body>
</html>
