name: WeChat Release
run-name: WeChat release ${{ inputs.version }} @ ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      auditid:
        description: Audit id printed by the selected successful upload workflow run
        required: true
        type: string
      version:
        description: Exact Mini Program version used by the upload workflow
        required: true
        type: string
      commit_sha:
        description: Exact 40-character origin/main commit used by the upload workflow
        required: true
        type: string
      upload_run_id:
        description: Successful Signed WeChat Upload run that submitted this audit id
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: wechat-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable upload provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
          AUDIT_ID: ${{ inputs.auditid }}
        run: |
          set -eu
          printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9A-Za-z._-]+$'
          printf '%s' "$RELEASE_COMMIT_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$UPLOAD_RUN_ID" | grep -Eq '^[0-9]+$'
          printf '%s' "$AUDIT_ID" | grep -Eq '^[0-9]+$'
          remote_sha=$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA"
          test "$remote_sha" = "$RELEASE_COMMIT_SHA"

          run_response=$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$UPLOAD_RUN_ID")
          test "$(printf '%s' "$run_response" | jq -r '.name')" = "Signed WeChat Upload"
          test "$(printf '%s' "$run_response" | jq -r '.path')" = ".github/workflows/wechat-upload.yml"
          test "$(printf '%s' "$run_response" | jq -r '.event')" = "workflow_dispatch"
          test "$(printf '%s' "$run_response" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$run_response" | jq -r '.head_branch')" = "main"
          test "$(printf '%s' "$run_response" | jq -r '.head_sha')" = "$RELEASE_COMMIT_SHA"
          expected_title="WeChat upload $RELEASE_VERSION @ $RELEASE_COMMIT_SHA"
          test "$(printf '%s' "$run_response" | jq -r '.display_title')" = "$expected_title"

      - name: Download verified audit provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wechat-audit-provenance
          path: verified-audit-provenance
          github-token: ${{ github.token }}
          run-id: ${{ inputs.upload_run_id }}

      - name: Verify audit provenance payload
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
          AUDIT_ID: ${{ inputs.auditid }}
        run: |
          set -eu
          provenance=verified-audit-provenance/wechat-audit-provenance.json
          test -f "$provenance"
          test "$(jq -r '.auditid' "$provenance")" = "$AUDIT_ID"
          test "$(jq -r '.version' "$provenance")" = "$RELEASE_VERSION"
          test "$(jq -r '.commit_sha' "$provenance")" = "$RELEASE_COMMIT_SHA"
          test "$(jq -r '.upload_run_id' "$provenance")" = "$UPLOAD_RUN_ID"
          test "$(jq -r 'keys | sort | join(",")' "$provenance")" = "auditid,commit_sha,upload_run_id,version"
          echo "Verified upload run $UPLOAD_RUN_ID: version=$RELEASE_VERSION commit=$RELEASE_COMMIT_SHA auditid=$AUDIT_ID"

      # Programmatic release is permitted only when the exact audit id can be
      # recovered from the immutable successful upload run above. A console-
      # submitted audit must also be released in the console, where its version
      # is visible, rather than being guessed by this workflow.
      - name: Check audit status and release when approved
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          AUDIT_ID: ${{ inputs.auditid }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
        run: |
          set -eu
          test -n "$WECHAT_APPID"
          test -n "$WECHAT_SECRET" || {
            echo "::error::WECHAT_SECRET is not configured in the wechat-release environment"
            exit 1
          }
          printf '%s' "$AUDIT_ID" | grep -Eq '^[0-9]+$' || {
            echo "::error::auditid must be a number from the upload workflow's audit submit step"
            exit 1
          }
          token_payload=$(jq -n \
            --arg appid "$WECHAT_APPID" \
            --arg secret "$WECHAT_SECRET" \
            '{grant_type: "client_credential", appid: $appid, secret: $secret, force_refresh: false}')
          token_response=$(curl -sS --max-time 30 -X POST \
            https://api.weixin.qq.com/cgi-bin/stable_token \
            -H 'Content-Type: application/json' \
            -d "$token_payload")
          access_token=$(printf '%s' "$token_response" | jq -r 'if .access_token then .access_token else empty end')
          if [ -z "$access_token" ]; then
            echo "::error::failed to obtain access token"
            printf '%s' "$token_response" | jq '{errcode, errmsg}'
            exit 1
          fi
          status_response=$(curl -sS --max-time 30 \
            "https://api.weixin.qq.com/wxa/get_auditstatus?access_token=$access_token&auditid=$AUDIT_ID")
          errcode=$(printf '%s' "$status_response" | jq -r '.errcode')
          if [ "$errcode" != "0" ]; then
            echo "::error::get_auditstatus failed for auditid=$AUDIT_ID"
            printf '%s' "$status_response" | jq '{errcode, errmsg}'
            exit 1
          fi
          audit_status=$(printf '%s' "$status_response" | jq -r '.status')
          case "$audit_status" in
            0)
              echo "Audit $AUDIT_ID approved, releasing"
              ;;
            1)
              reason=$(printf '%s' "$status_response" | jq -r '.reason')
              echo "::error::audit $AUDIT_ID rejected: $reason"
              exit 1
              ;;
            2)
              echo "Audit $AUDIT_ID still in review; run this workflow again once approved"
              exit 1
              ;;
            *)
              echo "::error::unknown audit status $audit_status"
              printf '%s' "$status_response" | jq .
              exit 1
              ;;
          esac
          release_response=$(curl -sS --max-time 30 -X POST \
            "https://api.weixin.qq.com/wxa/release?access_token=$access_token" \
            -H 'Content-Type: application/json' \
            -d '{}')
          release_errcode=$(printf '%s' "$release_response" | jq -r '.errcode')
          if [ "$release_errcode" != "0" ]; then
            echo "::error::release failed"
            printf '%s' "$release_response" | jq '{errcode, errmsg}'
            exit 1
          fi
          echo "Released audit $AUDIT_ID to production"
          echo "## WeChat Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: $RELEASE_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- upload run: $UPLOAD_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- audit: $AUDIT_ID" >> "$GITHUB_STEP_SUMMARY"
