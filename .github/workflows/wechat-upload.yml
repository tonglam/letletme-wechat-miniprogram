name: Signed WeChat Upload
run-name: WeChat upload ${{ inputs.version }} @ ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mini Program version
        required: true
        type: string
      description:
        description: Upload description
        required: true
        type: string
      commit_sha:
        description: Exact 40-character commit on origin/main
        required: true
        type: string
      auto_submit_audit:
        description: Attempt API audit submission; unsupported first-party credentials remain manual
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: wechat-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify main commit before build
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -eu
          test "${GITHUB_REF}" = "refs/heads/main"
          printf '%s' "$INPUT_COMMIT_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          checkout_sha=$(git rev-parse HEAD)
          remote_sha=$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')
          test "$INPUT_COMMIT_SHA" = "$checkout_sha"
          test "$checkout_sha" = "$remote_sha"
          echo "Verified main SHA $checkout_sha"
      - name: Verify production origin
        run: npm run check:production-origin
      - run: npm run lint:strict && npm run typecheck && npm test && npm run test:coverage && npm run check:style && npm run package:check
      - name: Prepare runtime dependency lock for security scans
        run: |
          set -eu
          mkdir -p runtime-scan
          node <<'NODE'
          const fs = require('node:fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const packages = Object.fromEntries(
            Object.entries(lock.packages).filter(([path, metadata]) => path === '' || !metadata.dev)
          )
          delete packages[''].devDependencies
          fs.writeFileSync('runtime-scan/package-lock.json', `${JSON.stringify({ ...lock, packages }, null, 2)}\n`)
          NODE
      - name: Dependency audit
        run: |
          # miniprogram-ci@2.1.5 is an exact, dev-only release-tool pin. Its
          # no-fix transitive findings are not shipped; the runtime graph is gated here.
          npm audit --omit=dev --audit-level=high
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile
            runtime-scan/package-lock.json
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Mini Program npm packages
        run: |
          node <<'NODE'
          const path = require('node:path')
          const ci = require('miniprogram-ci')

          async function main() {
            const result = await ci.packNpmManually({
              packageJsonPath: path.resolve('package.json'),
              miniprogramNpmDistDir: path.resolve('miniprogram')
            })
            const packageCount =
              (result.miniProgramPackNum ?? 0) + (result.otherNpmPackNum ?? 0)
            if (packageCount === 0) {
              throw new Error('Mini Program npm build produced no packages')
            }
            console.log(`Built ${packageCount} Mini Program npm packages`)
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
      - name: Prune unused Vant components
        run: node scripts/prune-vant.mjs
      - name: Reverify main before isolating release credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -eu
          remote_sha=$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')
          test "$RELEASE_COMMIT_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_COMMIT_SHA" = "$remote_sha"
      - name: Upload signed package
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DESCRIPTION: ${{ inputs.description }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -eu
          test "$RELEASE_COMMIT_SHA" = "$(git rev-parse HEAD)"
          test -n "$WECHAT_APPID"
          test -n "$WECHAT_PRIVATE_KEY"
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$key_file"
          ./node_modules/.bin/miniprogram-ci upload \
            --pp . \
            --pkp "$key_file" \
            --appid "$WECHAT_APPID" \
            --uv "$RELEASE_VERSION" \
            --ud "$RELEASE_DESCRIPTION" \
            --project-ignores 'miniprogram/assets/squad-pitch/kits/**/*' \
            --project-ignores 'miniprogram/assets/squad-pitch/pitch-background.jpg' \
            --project-ignores 'miniprogram/assets/squad-pitch/pitch-background.svg' \
            --use-project-config true \
            --enable-es6 true
      - name: Submit uploaded version for audit when supported
        if: ${{ inputs.auto_submit_audit }}
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DESCRIPTION: ${{ inputs.description }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -eu
          test -n "$WECHAT_APPID"
          test -n "$WECHAT_SECRET" || {
            echo "::error::WECHAT_SECRET is not configured in the wechat-release environment"
            exit 1
          }
          # stable_token with force_refresh=false reuses the cached token, so a
          # routine audit submit cannot invalidate a token held by the backend.
          token_payload=$(jq -n \
            --arg appid "$WECHAT_APPID" \
            --arg secret "$WECHAT_SECRET" \
            '{grant_type: "client_credential", appid: $appid, secret: $secret, force_refresh: false}')
          token_response=$(curl -sS --max-time 30 -X POST \
            https://api.weixin.qq.com/cgi-bin/stable_token \
            -H 'Content-Type: application/json' \
            -d "$token_payload")
          access_token=$(printf '%s' "$token_response" | jq -r 'if .access_token then .access_token else empty end')
          if [ -z "$access_token" ]; then
            echo "::error::failed to obtain access token"
            printf '%s' "$token_response" | jq '{errcode, errmsg}'
            exit 1
          fi
          # version_desc is a top-level property of submit_audit; item_list
          # elements describe audited pages and are omitted to audit the
          # whole project.
          audit_payload=$(jq -n --arg desc "$RELEASE_VERSION: $RELEASE_DESCRIPTION" '{version_desc: $desc}')
          audit_response=$(curl -sS --max-time 30 -X POST \
            "https://api.weixin.qq.com/wxa/submit_audit?access_token=$access_token" \
            -H 'Content-Type: application/json' \
            -d "$audit_payload")
          errcode=$(printf '%s' "$audit_response" | jq -r '.errcode')
          case "$errcode" in
            0)
              auditid=$(printf '%s' "$audit_response" | jq -r '.auditid')
              printf '%s' "$auditid" | grep -Eq '^[0-9]+$'
              jq -n \
                --arg auditid "$auditid" \
                --arg version "$RELEASE_VERSION" \
                --arg commit_sha "$RELEASE_COMMIT_SHA" \
                --arg upload_run_id "$GITHUB_RUN_ID" \
                '{auditid: $auditid, version: $version, commit_sha: $commit_sha, upload_run_id: $upload_run_id}' \
                > wechat-audit-provenance.json
              echo "Submitted for audit: auditid=$auditid"
              echo "auditid=$auditid" >> "$GITHUB_STEP_SUMMARY"
              ;;
            85009|85058)
              # The uploaded version is already under audit; treat as
              # idempotent success (85009 per docs, 85058 seen in the wild).
              echo "Audit already in progress for the current version, skipping submit"
              echo "audit_submission=ALREADY_IN_PROGRESS" >> "$GITHUB_STEP_SUMMARY"
              ;;
            86000)
              # First-party app credentials cannot call submit_audit. The
              # upload is still complete; an operator must submit the version
              # from the WeChat MP console or use a third-party-authorized
              # credential. Do not manufacture an audit id or claim release.
              echo "::warning::Upload succeeded; WeChat audit submission requires the Mini Program console or a third-party-authorized credential (errcode 86000)"
              echo "audit_submission=MANUAL_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
              printf '%s' "$audit_response" | jq '{errcode, errmsg}' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::submit_audit failed"
              printf '%s' "$audit_response" | jq '{errcode, errmsg}'
              exit 1
              ;;
          esac
      - name: Publish verified audit provenance
        if: ${{ inputs.auto_submit_audit && hashFiles('wechat-audit-provenance.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wechat-audit-provenance
          path: wechat-audit-provenance.json
          if-no-files-found: error
          retention-days: 90
