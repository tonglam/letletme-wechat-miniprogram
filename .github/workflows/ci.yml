name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare runtime dependency lock for security scans
        run: |
          set -eu
          scan_dir="$(mktemp -d)"
          node -e 'const fs = require("node:fs"); const packagePath = process.argv[1]; const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); delete pkg.devDependencies; delete pkg.scripts; fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`)' "$scan_dir/package.json"
          npm install --prefix "$scan_dir" --package-lock-only --ignore-scripts --omit=dev
          mkdir -p runtime-scan
          cp "$scan_dir/package-lock.json" runtime-scan/package-lock.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:style
      - run: npm run package:check
      # miniprogram-ci@2.1.5 is an exact, dev-only release-tool pin. Its
      # no-fix transitive findings are not shipped; the runtime graph is gated here.
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile
            runtime-scan/package-lock.json
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
